[project]
name = "python-algorithm-lab"
version = "0.1.0"
description = "Python algorithms and data structures for interview practice"
readme = "README.md"
authors = [
    { name = "Jacob Gelling", email = "3254275+jacobgelling@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
python-algorithm-lab = "python_algorithm_lab:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
